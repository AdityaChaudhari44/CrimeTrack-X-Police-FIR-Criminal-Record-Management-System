{% extends "base.html" %}{% block title %}Edit user role · Crime Track-X{% endblock %}{% block eyebrow %}ADMINISTRATION{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">ACCESS CONTROL</div><h1>Edit account role</h1><p>Account: {{ account.username }}</p></div></div><div class="panel form-panel"><form method="post">{% csrf_token %}<label class="form-label" for="role">Role</label><select class="form-select mb-4" name="role" id="role"><option value="officer" {% if profile.role == "officer" %}selected{% endif %}>Police Officer</option><option value="admin" {% if profile.role == "admin" %}selected{% endif %}>Administrator</option></select><button class="btn btn-primary">Save role</button><a href="{% url 'user_list' %}" class="btn btn-light ms-2">Cancel</a></form></div>{% endblock %}
