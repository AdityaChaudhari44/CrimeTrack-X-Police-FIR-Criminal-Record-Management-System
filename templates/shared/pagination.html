{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination-row"><span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-sm btn-light" href="?page={{ page_obj.previous_page_number }}&q={{ query|urlencode }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm btn-light" href="?page={{ page_obj.next_page_number }}&q={{ query|urlencode }}">Next</a>{% endif %}</div></nav>{% endif %}
